# TeamOne 附属组件。WSL 为 mirrored 网络模式（.wslconfig），docker 端口发布在该模式下数据路径
# 不通（实测 Windows/WSL 双向 localhost:3000 均挂起），故 valkey/gitea 用 host 网络直绑端口；
# 镜像网络下 localhost 双向互通：Windows 直达 :3000/:6379，容器经 localhost 回调宿主 :8080。
# 用法（WSL 内）: docker compose -f /mnt/c/.../deploy/docker-compose.yml up -d
# act_runner 不走 compose：注册需自定义 config（container.network=host），由 w1-10-bootstrap.sh 用 docker run 托管。
name: teamone

services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: teamone-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    network_mode: host          # 6379 直绑 WSL（镜像模式下 Windows localhost:6379 可达）
    volumes:
      - valkeydata:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: teamone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-teamone}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-teamone-dev-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  gitea:
    image: gitea/gitea:1.27
    container_name: teamone-gitea
    profiles: ["eng"]           # --profile eng 时启用
    environment:
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__service__DISABLE_REGISTRATION: "true"
      # 跳过安装向导（CLI 建号要求已安装状态）；Gitea 自身元数据用 SQLite（dev 足够）
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
    network_mode: host          # 3000/2222 直绑 WSL（镜像模式下 Windows localhost:3000 可达）
    volumes:
      - giteadata:/data
    restart: unless-stopped

volumes:
  valkeydata:
  miniodata:
  giteadata:
