# TeamOne 附属组件（D-2026-09-11-B：Git 内核自研，已移除 gitea/runner）
# WSL 为 mirrored 网络模式，docker 端口发布在该模式下数据路径不通，故容器用 host 网络直绑。
# 仓库存储为本地 bare repo（见 deploy/git-init-repo.sh）；CI 为自研（deploy/ci.sh）。
# 用法（WSL 内）: docker compose -f /mnt/c/.../deploy/docker-compose.yml up -d
name: teamone

services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: teamone-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    network_mode: host          # 6379 直绑 WSL（镜像模式下 Windows localhost:6379 可达）
    volumes:
      - valkeydata:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: teamone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-teamone}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-teamone-dev-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  valkeydata:
  miniodata:
